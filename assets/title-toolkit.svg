<svg xmlns="http://www.w3.org/2000/svg" width="221.618" height="74" viewBox="0 0 221.618 74">
<defs><style>@font-face{font-family:AMDisplay;src:url(data:font/woff;base64,) format('woff')}
.d{font-family:AMDisplay,Poppins,'Segoe UI',sans-serif;font-weight:700}
.b{font-family:AMBody,Poppins,'Segoe UI',sans-serif;font-weight:500}
.m{font-family:AMMono,'DejaVu Sans Mono',Consolas,monospace}
.mb{font-family:AMMonoB,'DejaVu Sans Mono',Consolas,monospace;font-weight:700}
.pop{opacity:0;animation:pop .55s cubic-bezier(.2,1.4,.4,1) forwards}
.fade{opacity:0;animation:fade .5s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateY(14px) scale(.96)}100%{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.pop,.fade{animation:none;opacity:1}}
</style>
<pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#2b2f57"/></pattern>
</defs>
<g class="pop"><g transform="rotate(-2 108.809 36)">
<rect x="8" y="18" width="201.618" height="48" rx="12" fill="#1f3d8f"/>
<rect x="8" y="12" width="201.618" height="48" rx="12" fill="#3464d8" stroke="#ffffff" stroke-opacity=".14"/>
</g>
<text x="108.809" y="45" text-anchor="middle" class="d" font-size="27" fill="#f4f5ff" transform="rotate(-2 108.809 36)">Daily toolkit</text></g>
</svg>